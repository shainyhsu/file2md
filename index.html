<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forest MD Converter · 檔案轉 Markdown</title>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0a0f0c;
      --bg2: #111916;
      --card: #16201a;
      --border: #2a3c32;
      --text: #e8f0e9;
      --muted: #8aa392;
      --accent: #5d9e6f;
      --accent-hover: #6fb382;
      --moss: #3d6b4f;
      --pine: #2d4a3a;
      --success: #6bcf7f;
      --danger: #e07a6a;
      --warning: #d4a84b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(61, 107, 79, 0.18) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(45, 74, 58, 0.15) 0%, transparent 45%);
    }
    .container { max-width: 960px; margin: 0 auto; padding: 28px 18px 60px; }
    header {
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .header-text h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #a8d5b5 0%, #5d9e6f 60%, #3d6b4f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

    .lang-toggle {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #1a2420;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      padding: 0;
    }
    .lang-toggle:hover {
      background: var(--moss);
      border-color: var(--accent);
    }
    .lang-toggle:active { transform: scale(0.94); }
    .lang-toggle svg { width: 20px; height: 20px; }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 18px;
      padding: 44px 24px;
      text-align: center;
      background: var(--card);
      transition: all 0.25s ease;
      cursor: pointer;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .dropzone::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(93, 158, 111, 0.08), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: #1a2820;
    }
    .dropzone:hover::before, .dropzone.dragover::before { opacity: 1; }
    .dropzone .icon { font-size: 2.8rem; margin-bottom: 10px; filter: grayscale(0.3); }
    .dropzone strong { font-size: 1.1rem; }
    .dropzone p { color: var(--muted); margin-top: 10px; font-size: 0.9rem; }
    .formats {
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
      margin-top: 16px;
    }
    .formats span {
      background: var(--pine);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .status {
      margin: 14px 0;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      display: none;
      border: 1px solid transparent;
    }
    .status.show { display: block; }
    .status.info { background: #1a2e24; color: #9dceb0; border-color: #2d4a3a; }
    .status.success { background: #1a2e22; color: var(--success); border-color: #2d5a3e; }
    .status.error { background: #2e1a1a; color: var(--danger); border-color: #5a2d2d; }
    .status.warning { background: #2e2a1a; color: var(--warning); border-color: #5a4d2d; }

    .results { display: none; margin-top: 8px; }
    .results.show { display: block; }

    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--accent);
      color: #0a0f0c;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--card); border-color: var(--accent); }

    .file-list { display: flex; flex-direction: column; gap: 10px; }
    .file-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .file-card:hover { border-color: var(--moss); }
    .file-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg2);
      gap: 12px;
      flex-wrap: wrap;
    }
    .file-name {
      font-weight: 600;
      font-size: 0.95rem;
      display: flex; align-items: center; gap: 8px;
    }
    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
    }
    .badge.ok { background: #1e3d2a; color: var(--success); }
    .badge.err { background: #3d1e1e; color: var(--danger); }
    .file-actions { display: flex; gap: 8px; }
    .file-actions button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .file-actions button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .file-body {
      padding: 0 16px 14px;
      display: none;
    }
    .file-body.open { display: block; }
    .file-body textarea {
      width: 100%;
      height: 280px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 14px;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      resize: vertical;
      margin-top: 10px;
    }
    .error-msg { color: var(--danger); font-size: 0.88rem; padding: 12px 0 4px; }

    footer {
      margin-top: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-text">
        <h1 data-i18n="title">🌲 Forest MD Converter</h1>
        <p class="subtitle" data-i18n="subtitle">純前端轉換・支援批次・檔案永不離開裝置</p>
      </div>

      <button class="lang-toggle" id="langToggle" title="切換語言 / Toggle language" aria-label="Language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </button>
    </header>

    <div class="dropzone" id="dropzone">
      <div class="icon">🍃</div>
      <strong data-i18n="dropTitle">拖曳檔案到這裡，或點擊選擇（可複選）</strong>
      <p data-i18n="dropDesc">支援 PDF、DOCX、PPTX、XLSX、CSV、JSON、HTML、TXT、MD</p>
      <div class="formats">
        <span>PDF</span><span>DOCX</span><span>PPTX</span><span>XLSX</span>
        <span>CSV</span><span>JSON</span><span>HTML</span><span>TXT</span>
      </div>
      <input type="file" id="fileInput" multiple
        accept=".pdf,.docx,.pptx,.xlsx,.xls,.csv,.tsv,.json,.xml,.html,.htm,.txt,.md,.markdown"
        style="display:none" />
    </div>

    <div class="status" id="status"></div>

    <div class="results" id="results">
      <div class="toolbar">
        <button class="btn" id="downloadAllBtn" data-i18n="downloadZip">⬇ 全部打包成 ZIP</button>
        <button class="btn btn-ghost" id="clearAllBtn" data-i18n="clearAll">清除全部</button>
        <span id="countLabel" style="color:var(--muted);font-size:0.88rem;margin-left:auto;"></span>
      </div>
      <div class="file-list" id="fileList"></div>
    </div>

    <footer data-i18n="footer">
      mammoth · SheetJS · PDF.js · JSZip · Turndown · Tesseract.js<br>
      靈感來自 Microsoft MarkItDown · 100% 本地執行
    </footer>
  </div>

  <script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';

    const i18n = {
      zh: {
        title: '🌲 Forest MD Converter',
        subtitle: '純前端轉換・支援批次・檔案永不離開裝置',
        dropTitle: '拖曳檔案到這裡，或點擊選擇（可複選）',
        dropDesc: '支援 PDF、DOCX、PPTX、XLSX、CSV、JSON、HTML、TXT、MD',
        downloadZip: '⬇ 全部打包成 ZIP',
        clearAll: '清除全部',
        footer: 'mammoth · SheetJS · PDF.js · JSZip · Turndown · Tesseract.js<br>靈感來自 Microsoft MarkItDown · 100% 本地執行',
        converting: n => `正在轉換 ${n} 個檔案…`,
        done: (ok, total) => `完成：${ok} 成功，${total - ok} 失敗`,
        copied: '已複製到剪貼簿',
        preview: '預覽',
        download: '下載',
        copy: '複製',
        remove: '移除',
        success: '完成',
        failed: '失敗',
        count: (ok, total) => `${ok} / ${total} 成功`,
        unsupported: ext => `不支援的格式：.${ext}`,
        pptxEmpty: '無法從 PPTX 提取文字（可能是空投影片或純圖片）',
        pdfEmpty: '此 PDF 沒有文字層，正在 OCR…',
        pdfFail: msg => `PDF 讀取失敗：${msg}`,
        ocrProgress: (page, total) => `OCR 中：第 ${page}/${total} 頁…`,
        ocrLoading: '正在載入 OCR 引擎（首次會下載語系檔）…',
        ocrDone: 'OCR 完成',
        ocrFail: msg => `OCR 失敗：${msg}`,
        emptyContent: '內容是空的，無法下載',
        noFiles: '沒有可下載的檔案'
      },
      en: {
        title: '🌲 Forest MD Converter',
        subtitle: 'Client-side conversion · Batch support · Files never leave your device',
        dropTitle: 'Drop files here, or click to select (multiple allowed)',
        dropDesc: 'Supports PDF, DOCX, PPTX, XLSX, CSV, JSON, HTML, TXT, MD',
        downloadZip: '⬇ Download all as ZIP',
        clearAll: 'Clear all',
        footer: 'mammoth · SheetJS · PDF.js · JSZip · Turndown · Tesseract.js<br>Inspired by Microsoft MarkItDown · 100% local',
        converting: n => `Converting ${n} file(s)…`,
        done: (ok, total) => `Done: ${ok} succeeded, ${total - ok} failed`,
        copied: 'Copied to clipboard',
        preview: 'Preview',
        download: 'Download',
        copy: 'Copy',
        remove: 'Remove',
        success: 'Done',
        failed: 'Failed',
        count: (ok, total) => `${ok} / ${total} succeeded`,
        unsupported: ext => `Unsupported format: .${ext}`,
        pptxEmpty: 'Could not extract text from PPTX (empty slides or image-only)',
        pdfEmpty: 'No text layer — running OCR…',
        pdfFail: msg => `PDF read failed: ${msg}`,
        ocrProgress: (page, total) => `OCR: page ${page}/${total}…`,
        ocrLoading: 'Loading OCR engine (first run downloads language data)…',
        ocrDone: 'OCR finished',
        ocrFail: msg => `OCR failed: ${msg}`,
        emptyContent: 'Empty content, cannot download',
        noFiles: 'No files to download'
      }
    };

    let lang = localStorage.getItem('forest-md-lang') || 'zh';

    function t(key, ...args) {
      const val = i18n[lang][key];
      return typeof val === 'function' ? val(...args) : val;
    }

    function applyLang() {
      document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (i18n[lang][key]) el.innerHTML = i18n[lang][key];
      });
      document.getElementById('langToggle').title =
        lang === 'zh' ? 'Switch to English' : '切換為繁體中文';
      renderList();
    }

    document.getElementById('langToggle').addEventListener('click', () => {
      lang = lang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('forest-md-lang', lang);
      applyLang();
    });

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const statusEl = document.getElementById('status');
    const results = document.getElementById('results');
    const fileList = document.getElementById('fileList');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const countLabel = document.getElementById('countLabel');

    const turndown = new TurndownService({
      headingStyle: 'atx',
      codeBlockStyle: 'fenced',
      bulletListMarker: '-'
    });

    let items = [];
    let tessWorker = null;

    function showStatus(msg, type = 'info') {
      statusEl.textContent = msg;
      statusEl.className = `status show ${type}`;
    }
    function hideStatus() { statusEl.className = 'status'; }

    async function convertFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      const buffer = await file.arrayBuffer();

      if (['txt', 'md', 'markdown'].includes(ext)) {
        return new TextDecoder().decode(buffer);
      }
      if (['html', 'htm'].includes(ext)) {
        return turndown.turndown(new TextDecoder().decode(buffer));
      }
      if (ext === 'json') {
        const text = new TextDecoder().decode(buffer);
        try {
          return '```json\n' + JSON.stringify(JSON.parse(text), null, 2) + '\n```';
        } catch { return text; }
      }
      if (ext === 'xml') {
        return '```xml\n' + new TextDecoder().decode(buffer) + '\n```';
      }
      if (['csv', 'tsv'].includes(ext)) {
        const text = new TextDecoder().decode(buffer);
        const delim = ext === 'tsv' ? '\t' : ',';
        const rows = text.trim().split(/\r?\n/).map(r => r.split(delim));
        if (!rows.length) return '';
        const header = rows[0].map(c => c.trim()).join(' | ');
        const sep = rows[0].map(() => '---').join(' | ');
        const body = rows.slice(1).map(r => r.map(c => c.trim()).join(' | ')).join('\n');
        return header + '\n' + sep + '\n' + body;
      }
      if (ext === 'docx') {
        const result = await mammoth.convertToHtml({ arrayBuffer: buffer });
        return turndown.turndown(result.value);
      }
      if (['xlsx', 'xls'].includes(ext)) {
        const wb = XLSX.read(buffer, { type: 'array' });
        let md = '';
        wb.SheetNames.forEach((name, i) => {
          if (i) md += '\n\n';
          md += '## ' + name + '\n\n';
          const sheet = wb.Sheets[name];
          const csv = XLSX.utils.sheet_to_csv(sheet);
          const rows = csv.trim().split(/\r?\n/).map(r => r.split(','));
          if (!rows.length) return;
          md += rows[0].join(' | ') + '\n';
          md += rows[0].map(() => '---').join(' | ') + '\n';
          md += rows.slice(1).map(r => r.join(' | ')).join('\n');
        });
        return md;
      }
      if (ext === 'pdf') {
        return await convertPdf(buffer);
      }
      if (ext === 'pptx') {
        return await extractPptx(buffer);
      }
      throw new Error(t('unsupported', ext));
    }

    async function extractPptx(arrayBuffer) {
      const zip = await JSZip.loadAsync(arrayBuffer);
      const aNS = 'http://schemas.openxmlformats.org/drawingml/2006/main';
      let md = '';
      let slideIndex = 1;
      while (true) {
        const file = zip.file('ppt/slides/slide' + slideIndex + '.xml');
        if (!file) break;
        const xml = await file.async('text');
        const doc = new DOMParser().parseFromString(xml, 'application/xml');
        const nodes = doc.getElementsByTagNameNS(aNS, 't');
        const texts = [];
        for (let i = 0; i < nodes.length; i++) {
          const txt = nodes[i].textContent.trim();
          if (txt) texts.push(txt);
        }
        if (texts.length) {
          md += '## Slide ' + slideIndex + '\n\n';
          md += texts.join('\n') + '\n\n';
        }
        slideIndex++;
      }
      if (!md) throw new Error(t('pptxEmpty'));
      return md.trim();
    }

    async function getTessWorker() {
      if (tessWorker) return tessWorker;
      showStatus(t('ocrLoading'), 'info');
      // chi_tra = Traditional Chinese, eng = English (non-China, Google Tesseract)
      tessWorker = await Tesseract.createWorker('chi_tra+eng', 1, {
        logger: m => {
          if (m.status === 'loading language traineddata' || m.status === 'initializing api') {
            showStatus(t('ocrLoading') + ' ' + (m.progress != null ? Math.round(m.progress * 100) + '%' : ''), 'info');
          }
        }
      });
      return tessWorker;
    }

    async function renderPageToCanvas(page, scale) {
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport }).promise;
      return canvas;
    }

    async function convertPdf(buffer) {
      let pdf;
      try {
        pdf = await pdfjsLib.getDocument({
          data: buffer,
          disableAutoFetch: true,
          disableStream: true
        }).promise;
      } catch (err) {
        throw new Error(t('pdfFail', err.message || String(err)));
      }

      const numPages = pdf.numPages;
      const textPages = [];
      let hasText = false;

      for (let i = 1; i <= numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent({ includeMarkedContent: false });
        let pageText = '';
        for (const item of content.items) {
          if (!item.str) continue;
          pageText += item.str;
          pageText += item.hasEOL ? '\n' : ' ';
        }
        pageText = pageText.replace(/[ \t]+\n/g, '\n').replace(/[ \t]{2,}/g, ' ').trim();
        textPages.push(pageText);
        if (pageText.length > 20) hasText = true;
      }

      if (hasText) {
        return textPages.filter(Boolean).join('\n\n').trim();
      }

      showStatus(t('pdfEmpty'), 'info');
      let worker;
      try {
        worker = await getTessWorker();
      } catch (err) {
        throw new Error(t('ocrFail', err.message || String(err)));
      }

      const ocrPages = [];
      const isMobile = window.innerWidth < 700;
      const scale = isMobile ? 1.5 : 2.0;

      for (let i = 1; i <= numPages; i++) {
        showStatus(t('ocrProgress', i, numPages), 'info');
        const page = await pdf.getPage(i);
        const canvas = await renderPageToCanvas(page, scale);
        try {
          const { data } = await worker.recognize(canvas);
          const cleaned = (data && data.text ? data.text : '').trim();
          if (cleaned) ocrPages.push(cleaned);
        } catch (pageErr) {
          console.warn('OCR page failed', i, pageErr);
        }
        canvas.width = 0;
        canvas.height = 0;
      }

      const result = ocrPages.join('\n\n').trim();
      if (!result) {
        throw new Error(t('ocrFail', lang === 'zh' ? '未能辨識出文字' : 'No text recognized'));
      }
      showStatus(t('ocrDone'), 'success');
      setTimeout(hideStatus, 2000);
      return result;
    }

    function renderList() {
      fileList.innerHTML = '';
      items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'file-card';
        const statusBadge = item.error
          ? '<span class="badge err">' + t('failed') + '</span>'
          : '<span class="badge ok">' + t('success') + '</span>';
        card.innerHTML =
          '<div class="file-header">' +
            '<div class="file-name">' + statusBadge + ' ' + escapeHtml(item.name) + '</div>' +
            '<div class="file-actions">' +
              (item.error ? '' :
                '<button data-action="toggle" data-idx="' + idx + '">' + t('preview') + '</button>' +
                '<button data-action="download" data-idx="' + idx + '">' + t('download') + '</button>' +
                '<button data-action="copy" data-idx="' + idx + '">' + t('copy') + '</button>') +
              '<button data-action="remove" data-idx="' + idx + '">' + t('remove') + '</button>' +
            '</div>' +
          '</div>' +
          '<div class="file-body" id="body-' + idx + '">' +
            (item.error
              ? '<div class="error-msg">' + escapeHtml(item.error) + '</div>'
              : '<textarea readonly>' + escapeHtml(item.md) + '</textarea>') +
          '</div>';
        fileList.appendChild(card);
      });

      results.classList.toggle('show', items.length > 0);
      const okCount = items.filter(i => !i.error).length;
      countLabel.textContent = items.length ? t('count', okCount, items.length) : '';
      downloadAllBtn.disabled = okCount === 0;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    fileList.addEventListener('click', e => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const idx = +btn.dataset.idx;
      const action = btn.dataset.action;
      const item = items[idx];
      if (!item) return;

      if (action === 'toggle') {
        document.getElementById('body-' + idx).classList.toggle('open');
      } else if (action === 'download') {
        downloadMd(item.name, item.md);
      } else if (action === 'copy') {
        navigator.clipboard.writeText(item.md).then(() => {
          showStatus(t('copied'), 'success');
          setTimeout(hideStatus, 1800);
        });
      } else if (action === 'remove') {
        items.splice(idx, 1);
        renderList();
      }
    });

    async function triggerDownload(blob, filename) {
      // File System Access (Chrome)
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{
              description: 'File',
              accept: {
                'text/plain': ['.md', '.txt'],
                'application/zip': ['.zip']
              }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          showStatus(lang === 'zh' ? '已儲存' : 'Saved', 'success');
          setTimeout(hideStatus, 1500);
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return;
        }
      }

      // Web Share Level 2 (Android Chrome often supports files)
      if (navigator.canShare && navigator.share) {
        try {
          const file = new File([blob], filename, {
            type: blob.type || 'application/octet-stream'
          });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: filename });
            return;
          }
        } catch (e) {
          if (e && e.name === 'AbortError') return;
        }
      }

      // Classic blob + <a download>
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.setAttribute('download', filename);
      a.rel = 'noopener';
      a.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;';
      document.body.appendChild(a);
      a.click();
      // Keep blob URL alive long enough for Android download manager
      setTimeout(function () {
        try { document.body.removeChild(a); } catch (e) {}
        URL.revokeObjectURL(url);
      }, 60000);
    }

    async function downloadMd(originalName, content) {
      if (content == null || String(content).trim() === '') {
        showStatus(t('emptyContent'), 'error');
        return;
      }
      const name = originalName.replace(/\.[^.]+$/, '') + '.md';
      // text/plain is more reliable than text/markdown on Android
      const blob = new Blob(['\uFEFF' + content], { type: 'text/plain;charset=utf-8' });
      await triggerDownload(blob, name);
    }

    downloadAllBtn.addEventListener('click', async () => {
      const okItems = items.filter(i => !i.error && i.md);
      if (!okItems.length) {
        showStatus(t('noFiles'), 'error');
        return;
      }
      const zip = new JSZip();
      okItems.forEach(item => {
        const name = item.name.replace(/\.[^.]+$/, '') + '.md';
        zip.file(name, '\uFEFF' + item.md);
      });
      const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/zip' });
      await triggerDownload(blob, 'markdown-files.zip');
    });

    clearAllBtn.addEventListener('click', () => {
      items = [];
      renderList();
      fileInput.value = '';
      hideStatus();
    });

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length) processFiles([...e.dataTransfer.files]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) processFiles([...fileInput.files]);
    });

    async function processFiles(files) {
      showStatus(t('converting', files.length), 'info');
      results.classList.add('show');

      for (const file of files) {
        try {
          const md = await convertFile(file);
          items.push({ name: file.name, md: md || '' });
        } catch (err) {
          console.error(err);
          items.push({ name: file.name, md: '', error: err.message || String(err) });
        }
        renderList();
      }

      const ok = items.filter(i => !i.error).length;
      showStatus(t('done', ok, items.length), ok ? 'success' : 'error');
      setTimeout(hideStatus, 3500);
      fileInput.value = '';
    }

    applyLang();
  </script>
</body>
</html>
