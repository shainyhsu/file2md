<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌲 Forest MD Converter · 檔案轉 Markdown</title>
    <!-- 引入核心轉換與壓縮套件 -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    
    <style>
        :root { --primary: #2d6a4f; --bg: #f4f9f4; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #333; max-width: 800px; margin: 40px auto; padding: 0 20px; text-align: center; }
        h1 { color: var(--primary); }
        .drop-zone { border: 3px dashed var(--primary); background: #fff; padding: 40px; border-radius: 12px; cursor: pointer; margin: 20px 0; transition: 0.3s; }
        .drop-zone:hover { background: #e8f5e9; }
        .btn-group { margin: 20px 0; display: flex; gap: 10px; justify-content: center; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; }
        button:hover { background: #1b4332; }
        #file-list { text-align: left; background: white; border-radius: 8px; padding: 10px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
        .file-item:last-child { border-bottom: none; }
        .download-btn { background: #4a90e2; padding: 5px 10px; font-size: 13px; }
        .download-btn:hover { background: #357abd; }
    </style>
</head>
<body>

    <h1>🌲 Forest MD Converter</h1>
    <p>純前端轉換・支援批次・檔案永不離開裝置</p>
    
    <div class="drop-zone" id="drop-zone">
        <strong>拖曳檔案到這裡，或點擊選擇（可複選）</strong>
        <p style="font-size:13px; color:#666;">支援 PDF, DOCX, XLSX, CSV, JSON, HTML, TXT, MD</p>
        <input type="file" id="file-input" multiple style="display: none;">
    </div>

    <div class="btn-group">
        <button onclick="downloadAllAsZip()">⬇ 全部打包成 ZIP</button>
        <button style="background:#d9534f;" onclick="clearAll()">清除全部</button>
    </div>

    <div id="file-list" style="display:none;"></div>

    <script>
        // 設定 PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';
        const turndownService = new TurndownService();
        
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        let convertedFiles = []; // 儲存成功轉換的檔案資料

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = '#e8f5e9'; });
        dropZone.addEventListener('dragleave', () => dropZone.style.background = '#fff');
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.style.background = '#fff'; handleFiles(e.dataTransfer.files); });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        async function handleFiles(files) {
            if(files.length > 0) fileList.style.display = 'block';
            
            for (let file of files) {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'file-item';
                itemDiv.innerHTML = `<span>📄 ${file.name} (轉換中...)</span>`;
                fileList.appendChild(itemDiv);

                try {
                    let mdContent = await convertToMarkdown(file);
                    
                    // 轉換成功，保存資料
                    const fileData = { name: file.name, content: mdContent };
                    convertedFiles.push(fileData);

                    // 更新 UI 並綁定下載事件
                    itemDiv.innerHTML = `
                        <span>📄 ${file.name} (轉換成功)</span>
                        <button class="download-btn">儲存 MD</button>
                    `;
                    
                    // ✨ 核心修正：綁定單檔下載，確保傳入正確的檔名與純文字內容
                    itemDiv.querySelector('.download-btn').addEventListener('click', () => {
                        saveSingleFile(fileData.name, fileData.content);
                    });

                } catch (error) {
                    console.error(error);
                    itemDiv.innerHTML = `<span style="color:red;">❌ ${file.name} 轉換失敗</span>`;
                }
            }
        }

        // 核心轉換邏輯
        function convertToMarkdown(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                const ext = file.name.split('.').pop().toLowerCase();

                if (ext === 'txt' || ext === 'md') {
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsText(file);
                } else if (ext === 'html') {
                    reader.onload = (e) => resolve(turndownService.turndown(e.target.result));
                    reader.readAsText(file);
                } else if (ext === 'docx') {
                    reader.onload = async (e) => {
                        try {
                            const result = await mammoth.convertToMarkdown({ arrayBuffer: e.target.result });
                            resolve(result.value);
                        } catch (err) { reject(err); }
                    };
                    reader.readAsArrayBuffer(file);
                } else if (ext === 'xlsx' || ext === 'csv') {
                    reader.onload = (e) => {
                        try {
                            const workbook = XLSX.read(e.target.result, { type: 'binary' });
                            let md = "";
                            workbook.SheetNames.forEach(sheetName => {
                                md += `## Sheet: ${sheetName}\n\n`;
                                const csv = XLSX.utils.sheet_to_csv(workbook.Sheets[sheetName]);
                                md += csv.split('\n').map(row => row.split(',').join(' | ')).join('\n') + '\n\n';
                            });
                            resolve(md);
                        } catch (err) { reject(err); }
                    };
                    reader.readAsBinaryString(file);
                } else if (ext === 'pdf') {
                    reader.onload = async (e) => {
                        try {
                            const pdf = await pdfjsLib.getDocument({ data: e.target.result }).promise;
                            let text = "";
                            for (let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const content = await page.getTextContent();
                                text += content.items.map(item => item.str).join(' ') + '\n\n';
                            }
                            resolve(text);
                        } catch (err) { reject(err); }
                    };
                    reader.readAsArrayBuffer(file);
                } else if (ext === 'json') {
                    reader.onload = (e) => resolve("```json\n" + JSON.stringify(JSON.parse(e.target.result), null, 2) + "\n```");
                    reader.readAsText(file);
                } else {
                    reject("不支援的檔案格式");
                }
            });
        }

        // ✨ 核心修正：單一檔案儲存函式（徹底解決 0 KB 問題）
        function saveSingleFile(filename, markdownText) {
            if (!markdownText || markdownText.trim() === "") {
                alert("轉換內容為空，無法下載！");
                return;
            }

            // 修正關鍵：文字內容必須用中括號 [] 包裹成陣列，否則 Blob 的大小會變成 0
            const blob = new Blob([markdownText], { type: 'text/markdown;charset=utf-8;' });
            const link = document.createElement('a');
            
            // 更換副檔名為 .md
            const baseName = filename.substring(0, filename.lastIndexOf('.')) || filename;
            link.download = `${baseName}.md`;
            
            const url = URL.createObjectURL(blob);
            link.href = url;
            
            document.body.appendChild(link);
            link.click();
            
            // 清理節點與記憶體
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // 批次打包 ZIP 下載
        async function downloadAllAsZip() {
            if (convertedFiles.length === 0) {
                alert("目前沒有任何已成功轉換的檔案。");
                return;
            }
            const zip = new JSZip();
            convertedFiles.forEach(file => {
                const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                zip.file(`${baseName}.md`, file.content);
            });

            const content = await zip.generateAsync({ type: "blob" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "forest_markdown_batch.zip";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        function clearAll() {
            fileList.innerHTML = '';
            fileList.style.display = 'none';
            convertedFiles = [];
            fileInput.value = '';
        }
    </script>
</body>
</html>
